<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ email_title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Email-safe base styles (keep simple; rely on tables + inline style where needed). */
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F8FAFC; /* bg */
            color: #1E293B; /* body */
        }
        a { color: inherit; }

        .card {
            background-color: #ffffff;
            border: 1px solid #E2E8F0; /* border */
            border-radius: 12px;
            overflow: hidden;
        }
        .brand {
            padding: 20px 24px;
            background-color: #ffffff;
            border-bottom: 1px solid #E2E8F0;
        }
        .brand-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #1B2A4A; /* primary-container */
            line-height: 24px;
        }
        .brand-subtitle {
            margin: 4px 0 0 0;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #64748B; /* muted */
            line-height: 16px;
        }
        .content {
            padding: 24px;
        }
        .content h1,
        .content h2 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 600;
            line-height: 32px;
            color: #1B2A4A; /* primary-container */
        }
        .content p {
            margin: 0 0 12px 0;
            font-size: 16px;
            line-height: 24px;
            color: #1E293B; /* body */
        }
        .muted {
            color: #64748B;
            font-size: 12px;
            line-height: 16px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            line-height: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .badge-your-turn { background-color: #CCFBF1; color: #0D9488; }
        .badge-completed { background-color: #D1FAE5; color: #059669; }
        .badge-rejected { background-color: #FEE2E2; color: #DC2626; }
        .badge-pending { background-color: #FEF3C7; color: #D97706; }
        .badge-info { background-color: #DBEAFE; color: #2563EB; }

        .event {
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 14px 16px;
            background-color: #ffffff;
        }
        .event-title {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            color: #1B2A4A;
        }
        .event-meta {
            margin: 6px 0 0 0;
            font-size: 12px;
            line-height: 16px;
            color: #64748B;
        }

        .well {
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 14px 16px;
            background-color: #F1F5F9; /* surface */
        }
        .well-title {
            margin: 0 0 8px 0;
            font-size: 12px;
            font-weight: 600;
            line-height: 16px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #64748B;
        }
        .button {
            display: inline-block;
            background-color: #1B2A4A; /* primary-container */
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
        }
        .footer {
            padding: 18px 24px;
            border-top: 1px solid #E2E8F0;
            background-color: #ffffff;
            text-align: center;
            font-size: 12px;
            line-height: 16px;
            color: #64748B;
        }
    </style>
</head>
<body>
    <!-- Wrapper table for consistent email client rendering -->
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#F8FAFC;padding:24px 12px;">
        <tr>
            <td align="center" valign="top">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:600px;">
                    <tr>
                        <td class="card">
                            <div class="brand">
                                <p class="brand-title">{{ brand_name|default:"Incel E-Sign" }}</p>
                                <p class="brand-subtitle">Legal Authority</p>
                            </div>

                            <div class="content">
                                {% block content %}
                                {% endblock %}
                            </div>

                            <div class="footer">
                                <div>&copy; {{ year|default:"2026" }} {{ brand_name|default:"Incel E-Sign" }}. All rights reserved.</div>
                                <div style="margin-top:6px;">Need help? <a href="{{ support_url|default:'#' }}" style="color:#0D9488;text-decoration:underline;">Contact support</a>.</div>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
